idx: 3
layout: "제목 및 내용"
title: "영역별 예상 효과 및 투자 회수  ·  100명 기준"
pattern: "table_metrics"
accent_color: "#1F497D"
key_message: "영역별 효과 3~5배 차이 · 선별 적용이 핵심 · 투자 회수 1~2개월"
content_blocks:
  - kind: stoplight_table
    title: "① 영역별 효과 (신호등 평가)"
    columns: ["영역", "효과", "해석"]
    rows:
      - dot_color: "#2E8B57"
        bg_color: "#E8F5EC"
        area: "선행 R&D · 도구 · 테스트 자동화"
        effect: "+20 ~ +35%"
        effect_color: "#2E8B57"
        interpretation: "즉시 도입 권장 (위험 낮음 · 효과 큼)"
      - dot_color: "#2E8B57"
        bg_color: "#E8F5EC"
        area: "양산 일반 SW (비안전)"
        effect: "+10 ~ +20%"
        effect_color: "#2E8B57"
        interpretation: "코드 검사 도구 통합 후 도입"
      - dot_color: "#D4A017"
        bg_color: "#FFF7D9"
        area: "양산 안전 코드 (차량 안전등급 높음↑)"
        effect: "-5 ~ +10%"
        effect_color: "#D4A017"
        interpretation: "본전 영역 · 시범 측정 필요"
      - dot_color: "#C0504D"
        bg_color: "#FCE8E6"
        area: "품질검증 단계 (인력 관점)"
        effect: "-15 ~ -30%"
        effect_color: "#C0504D"
        interpretation: "코드 리뷰 부담 증가 · 인력 보강 필수"
  - kind: big_number_cards
    title: "② 투자 회수 효과 (100명 · 1년 기준)"
    layout: "1x3"
    cards:
      - label: "연 절감 효과"
        value: "약 15억 원"
        sub: "21,000시간 × 시간당 7.2만"
        accent: "#2E8B57"
      - label: "초기 투자"
        value: "약 1.2억 원"
        sub: "도구 3천 + 운영 9천만원"
        accent: "#4F81BD"
      - label: "손익분기점"
        value: "1 ~ 2개월"
        sub: "보수 보정 시 2~3개월"
        accent: "#1F497D"
data_refs:
  - "analysis.yaml > s5 (영역별 효과 매트릭스)"
  - "analysis.yaml > s7 (ROI 정량 모델)"
constraints:
  max_shapes: 30
  min_nontext_elements: 7     # 4 stoplight row bg + 3 big number card
notes: |
  상단 Key Message → 4행 신호등 표 (색상 배경 + OVAL dot + 효과% + 해석)
  → 하단 3개 큰 숫자 카드 (라벨 상단 / 큰 값 중앙 28pt / 부연 하단).
  이모지 사용 금지 (렌더 안 됨) — OVAL shape로 색상 dot 표현.
