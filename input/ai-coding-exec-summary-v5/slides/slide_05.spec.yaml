idx: 5
layout: "제목 및 내용"
title: "실행 로드맵 및 권고 사항"
pattern: "roadmap"
accent_color: "#2C7F94"
key_message: "단계적 도입 + 자사 시범으로 실측 · 선행 영역 우선 착수 (업계 권고)"
content_blocks:
  - kind: chevron_roadmap
    title: "① 단계적 도입 로드맵 (업계 일반 권고)"
    phases:
      - title: "Phase 1  ·  단기"
        body: "도구 · 테스트 자동화 파일럿\n위험 낮음 · 효과 큼"
        color: "#2E8B57"
      - title: "Phase 2  ·  중기"
        body: "선행 R&D · 응용SW 확대\n사내 AI 학습 · 자동 검사 통합"
        color: "#4F81BD"
      - title: "Phase 3  ·  장기"
        body: "양산 비안전 영역 단계 적용\n양산 안전은 시범 측정 후"
        color: "#1F497D"
  - kind: split_bottom
    layout: "1x2"
    left:
      kind: info_card
      accent: "#4F81BD"
      bg: "#E7F0FA"
      title: "② 자사 시범 사업 (실측 프로토콜)"
      items:
        - key: "대상"
          value: "영역별 대표 SW 모듈"
        - key: "기간"
          value: "별도 산정"
        - key: "규모·예산"
          value: "별도 산정 (파일럿 계획 수립 단계)"
        - key: "측정 지표"
          value: "공수 · 결함밀도 · 코드 리뷰 부담"
        - key: "목적"
          value: "자사 환경에서 영역별 실효성 실측"
    right:
      kind: recommendation_card
      accent: "#2C7F94"
      bg: "#E3F2F7"
      title: "③ 업계 권고 사항"
      items:
        - num: "①"
          label: "선행 · 테스트 자동화 영역 먼저 검토"
          note: "경쟁사 모두 이 영역부터 착수"
        - num: "②"
          label: "자사 시범 사업으로 실효성 실측"
          note: "양산 안전 영역은 공개 데이터 부재"
        - num: "③"
          label: "품질검증 인력·도구 동시 보강"
          note: "AI 코드량 증가는 리뷰 부담 증가로 직결"
        - num: "④"
          label: "사내 AI 사용 가이드라인 정비"
          note: "EU AI Act 2027.08 자동차 완전 적용"
  - kind: footnote_glossary
    entries:
      - "※ EU AI Act: EU 인공지능 규제법. 2024.08 발효 · 2027.08 자동차 등 embedded high-risk AI 완전 적용 D-Day"
data_refs:
  - "analysis.yaml > s10 (권고·로드맵)"
constraints:
  max_shapes: 45
  min_nontext_elements: 5
  no_approval_section: true
  footnote_glossary: true
notes: |
  본문 영역 y=0.68~6.55. 하단 각주 1행 (EU AI Act만).
  "승인 요청" 단어 금지 — "업계 권고".
