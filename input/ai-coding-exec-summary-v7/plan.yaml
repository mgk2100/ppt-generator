  2. S4 Faros AI 카드에 "리뷰 시간 +91% · PR 수 +98% 증가 사유" 해설 추가.
     - AI 코드량 급증 → PR 수 2배
     - 코드 중복 4배 (GitClear 2025) → MISRA C:2025 중복 규칙 검증 부담
     - 자동차 양산: ASPICE · ISO 26262 규정 준수는 사람 몫

  S1 (표지) → S2 (핵심 요약 + 각주)
  → S3 (경쟁사 코딩 도입 상세) → S4 (영역별 효과 + 리뷰 부담 증가 사유)
