# smart-factory-briefing — 분석 인벤토리
# 대상: 생산기술센터(생기센터) 스마트제조기술팀 정보공유 브리핑
# 소스: output/SL AI 플랫폼 개발 현황 보고 자료.pptx · output/sl-sw-agent-v11.pptx ·
#        smart-factory/260727_AI서버_도입계획_검토의견_회신.md · 사용자 제공 서버 스펙(2026-08-11)

meta:
  title: "AI 플랫폼 개발 현황 및 AI 서버 운영 경험 공유"
  purpose: "정보공유"
  author: "강민규 책임"
  department: "SDP센터 알고리즘개발팀"
  date: "2026.08.13"
  audience: >
    생기센터 스마트제조기술팀 — 자체 AI 서버(RTX PRO 6000 Blackwell x4, 9,500만원) 도입 계획 중.
    상용 LLM 보안 우려로 로컬 LLM 중심 활용을 구상. ML/DL 연구 경험 있는 기술 청중.
  tone: >
    "판단에 참고하실 자료" 스탠스 — 상대 계획을 부정하지 않고 실측 경험을 공유.
    추정치는 단정하지 않고 산정 기준을 명시.

# ── 1. 통합 플랫폼 (SL SW Agent) ──────────────────────────────
platform:
  name: "SL SW Agent"
  definition: "코딩 지원 · 취약점 분석 · SW 설계 문서 생성을 모두 제공하는 통합 agent"
  axes:
    - name: "AI 코딩 지원"
      flow: ["질문 · 코드 입력", "사내 문서 · 코드 검색 (RAG · 코드 저장소)", "LLM 활용", "답변 · 리뷰 · 수정안"]
      status_rows:
        - ["코드 질의응답", "웹 라이브 동작", "사내 스킬 연계 고도화"]
        - ["Claude Code 플러그인", "MCP 연동 구축", "skill 자동 실행 확대"]
    - name: "코드 심층 분석 (취약점)"
      flow: ["코드베이스 업로드", "코드 파싱 (tree-sitter)", "정적 검증 · 핵심 코드 분류", "LLM 활용 (취약점 진단 · 수정안)", "분석 보고서"]
      status_rows:
        - ["정적 검증", "컴파일 · MISRA 검증 구축 (cppcheck)", "다언어 확장 (tree-sitter)"]
        - ["분석 자료 작성", "AI 진단 · 수정안 구현", "자료 자동 작성"]
    - name: "SW 설계 문서 생성"
      flow: ["소스코드 업로드", "코드 파싱 (함수 · 호출 관계)", "섹션별 문서 생성 (LLM — 본문 · 다이어그램)", "SAD · SDD DOCX 출력"]
      status_rows:
        - ["SAD 생성", "자동 생성 파이프라인 검증", "생성 품질 고도화"]
        - ["SDD 생성", "생성 파이프라인 구축", "산출물 정식 적용"]
  milestone: "12월 테스터 기반 1차 구축 완료 → 2027.1월 중순 SW 설계자 오픈"

# ── 2. 전체 아키텍처 (v11 4p 사용자 확정 구조 — 변경 금지) ──────
architecture:
  reference_code: "input/sl-sw-agent-v11/slides/slide_04.code.py"
  layers:
    users: ["웹 UI", "IDE 플러그인"]
    agent_container: "SL SW Agent = coding-assistant(agent · mcp_server, 코딩 지원 · 취약점 분석) + doc-generator(SW 설계 문서 생성)"
    knowledge: ["RAG 지식 베이스 (pgvector · PostgreSQL)", "코드 저장소 (vault)", "MongoDB (파싱된 코드 · 문서 콘텐츠)", "MinIO (코드 압축파일 · 생성 문서 산출물)"]
    llm: ["상용 LLM — Claude · GPT (Enterprise API), 사내 스킬 · 지식 연계 → SL SW 최적화 답변",
          "사내 vLLM 서빙 — Gemma-4-31B · Qwen3-Embedding-8B (GPU 서버), 지식학습 지속 → 성능 확보 시 병행"]
  connector_rule: "연결선 6개 고정: 사용자→컨테이너 2(MCP) · 컨테이너↕지식 1(검색·저장) · 지식→상용 2 · 상용⇢vLLM 점선 1(지식학습 데이터)"

# ── 3. AI 활용 전략 3단계 (보고덱 3p) ─────────────────────────
strategy:
  phases:
    - {label: "초기", when: "2026.04", body: "내부 DB 활용으로 상용 LLM급 성능 기대, 코드 유출 X · 비용 0원 → 로컬 sLLM 채택"}
    - {label: "중간 — 현재", when: "2026.07", body: "로컬 sLLM 실측 한계 확인 → 상용 LLM 전환"}
    - {label: "최종 목표", when: "2026 하반기", body: "3축 통합 SW 설계용 AI Agent — 문서 · 분석은 상용 + 로컬 병행"}
  limit_callout:
    title: "로컬 sLLM 의 한계 — HW 증축 비현실적"
    items:
      - "sLLM 모델 실측 결과, 상용 LLM 대비 성능 부족"
      - "프론티어 오픈모델 필요 GPU — 50명 동시 사용 기준 (RTX PRO 6000 · 1,850만원/장)"
      - "DeepSeek-V4: 12장 ≈ 2.2억 원 / Kimi K2.7: 9장 ≈ 1.7억 원"
  reuse_callout:
    title: "로컬 sLLM 활용 전략"
    items:
      - "① 초기: 최신 상용 모델로 AI Agent 성능 확보"
      - "② 성능 확보 후: 지식증류로 로컬 sLLM 학습"
      - "③ 로컬 성능 확보 시: 상용 + 로컬 병행 → 상용 비용 완화"
  footnote: "지식증류: 고성능 AI(teacher)의 결과물로 소형 AI(student)를 학습시켜 성능을 근접시키는 기법"

