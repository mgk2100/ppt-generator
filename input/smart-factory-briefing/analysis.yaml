# ── 5. 로컬 LLM 실측 결과 (회신 메일 260727) ───────────────────
local_llm_quality:
  scope: "30B급 ~ 230B급 오픈소스 모델 다수를 실서버 구동 테스트"
  conclusion: "현업 즉시 적용에는 상용 프론티어급 모델과 격차가 큼"
  mechanism: "대형 모델을 96GB GPU에 올리려면 4bit 강압축 필수 → 품질 손실이 모델 크기 효과를 상쇄"
  cases:
    - "압축한 대형 모델이 중형 모델보다 나은 결과를 주지 못한 사례"
    - "일부 대형 모델은 간단한 질문에도 답을 정리하지 못해 사용 중단"
  current_ops: "로컬 = 사내 코드 검색 등 한정 용도 / 실제 업무 = 상용 LLM"
  footnote: "4bit 양자화: 모델 가중치 정밀도를 낮춰 용량을 약 1/4로 압축하는 기법 — 품질 손실 동반"

local_llm_concurrency:
  mechanism: "GPU 메모리에서 모델이 차지하고 남은 공간에 대화 내용(context)을 담는 구조 — 문서가 길수록 공간 급감"
  table:
    - {usage: "짧은 질의응답 (단답형 챗봇)", users: "30명 이상", value: 30}
    - {usage: "중간 길이 문서", users: "약 2명", value: 2}
    - {usage: "긴 문서 · 이력 데이터 분석", users: "약 1명", value: 1}
  note: "GPU 1장 기준 — GPU 4장이면 약 4배. 활용 가치가 높은 방식(설비 이력 통째 분석)일수록 동시 사용자 급감"

frontier_selfhost:
  model: "Kimi K3 (Moonshot AI, 2026.07 공개, 2.8조 파라미터) — 현재 최상위 오픈 모델"
  table:
    - ["모델 용량 (4bit 압축)", "약 1.4TB"]
    - ["필요 GPU (RTX PRO 6000 96GB)", "적재만 약 16장 · 실사용 약 20장"]
    - ["서버 환산 (1대 = GPU 4장)", "약 4~5대"]
    - ["시스템 메모리", "서버당 512GB × 4~5대 = 총 2TB 이상"]
    - ["압축 없이 (bf16) 구동", "GPU 약 58장"]
  nvlink: "RTX PRO 6000은 NVLink 미지원 — 4장 초과 분산 시 카드 간 통신 병목, 장수 증가 대비 실효 성능 비례 상승 없음 → 이 등급은 H200/B200 등 데이터센터급 GPU 영역"
  conclusion: "GPU 4장 규모의 현실적 운용 = 30B급 전후 오픈소스 모델"
  footnote: "NVLink: GPU 간 고속 직결 인터커넥트 — PCIe 대비 수 배 대역폭"

# ── 6. 운영 경험 5건 (회신 메일 260727) ────────────────────────
ops_experience:
  - topic: "저장 용량"
    ours: "AI 모델 저장소만 1.4TB 사용 중 (실측). 30B급 20~60GB · 100B급+ 130~180GB, 비교용 모델 누적 빠름"
    advice: "모델 1~2TB + 학습 데이터 감안 시 Data Lake 동거 여유 크지 않음. 초 단위 수년 축적이면 수십 TB. 1TB×10 보다 대용량 소수(7.68TB×2~4)가 슬롯 · 관리 유리"
  - topic: "AI 서버 · 데이터 플랫폼 분리"
    ours: "동거 시 AI 환경 업데이트 재부팅마다 DB 동반 다운, 학습 자원 점유 시 DB 응답 저하 → 분리 운영 (데이터 서버에는 GPU 없음)"
    advice: "GPU 서버와 데이터 플랫폼 서버 분리 구성 권장"
  - topic: "전원 · 발열"
    ours: "RTX PRO 6000 은 제품군별 300W/600W 2배 차이. 600W × 4장 = GPU만 2,400W"
    advice: "일반 사무실 콘센트 불가 — 전용 회로 필요. 발열 · 소음으로 전산실 설치 권장. 견적 시 제품군 · 소비전력 확인"
  - topic: "운영체제"
    ours: "Ubuntu 단일 운영 — AI 도구 대부분 Linux 기준"
    advice: "듀얼부팅은 OS 전환 시 전원 차단 필요 → 공용 서버 부적합"
  - topic: "GPU 사용률 기록"
    ours: "초기 기록이 없어 배치를 여러 번 조정"
    advice: "도입 초기부터 사용률 기록 → 이후 증설 판단 근거"

# ── 2-v2. 아키텍처 실코드 확정 사실 (2026-08-11 repo 분석 — v11 구도 대체) ──
architecture_v2:
  services:
    - "coding-assistant — 코딩 지원·코드 검증 (웹 대화·RAG 검색·MISRA 검증)"
    - "doc-generator — SW 설계 문서 생성 (파싱→섹션별 생성→SAD·SDD DOCX)"
    - "ca-analysis-pipeline — 코드 분석 Job 엔진 (정적분석+LLM→리뷰·취약점 리포트). CA가 zip 전송→리포트 회수"
  storage_facts:
    - "PostgreSQL(pgvector) = RAG 벡터 검색(HNSW)·대화·사용자 (coding-assistant)"
    - "vault = DB 아님 — 파일(git 형태) 저장소: 코드 심볼·콜그래프·모듈 요약"
    - "MongoDB = doc-generator 전용: 파싱 소스·생성 문서 콘텐츠"
    - "MinIO = 코드 압축파일·첨부·다이어그램·문서 산출물 (양쪽 사용)"
  llm_facts:
    - "상용 LLM = Claude·GPT — 코딩 지원 대화·설계 문서 본문 생성"
    - "사내 vLLM 라이브 = Gemma-4-31B (분석 파이프라인 서술) + Qwen3-Embedding-8B (RAG 임베딩). ※Qwen3-Coder 표기는 stale"
  tools: "tree-sitter(코드 파싱) · cppcheck(MISRA) · clang-tidy · flawfinder · bandit(Python)"

