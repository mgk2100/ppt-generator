      4) 취약점 분석 열 '개발 내용' = **ca_code_analysis.png 실캡처 (rev9)** — /code/analysis 분석 결과 화면(품질 요약·위험 파일), 캡션 "▲ 코드 분석 결과 — 실제 동작 화면 (라이브)"
      5) **'예상' 표기 전부 삭제 (rev6)** — "* 적재·분류·자료 작성 단계는 예상안" 캡션, "(예상 UI)", "(예상)" 제거
      6) 각주 = 항목당 1줄 + 약어 풀네임 병기 (design_system 2-2)
      7) build_slide_02 + force_font(slide, "맑은 고딕") 마지막 호출
