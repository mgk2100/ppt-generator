idx: 9
layout: "제목 및 내용"
title: "운영 경험 및 도입 시 참고 사항"
pattern: "table"
accent_color: "#024AD8"
key_message: "저장 · 분리 · 전원 · OS · 사용률 — 도입 전 확인하면 좋은 5가지"
design_language: "input/smart-factory-briefing/design_system.md 강제 + plan.yaml banned_details"
content_blocks:
  - kind: lead
    text: "서버 구축 · 운영에서 확인한 5가지 — 도입 판단에 참고할 사항"
    style: "Pretendard SemiBold 15pt INK, '5가지' PRIMARY"
  - kind: grid_table
    desc: |
      메인 표 add_grid_table — 3열 [구분 | 실측 | 도입 시 참고].
      헤더 CLOUD + SemiBold 10.5pt, 본문 9.5pt CHARCOAL 2줄 허용, 구분 열 SemiBold INK,
      수평 hairline 위주. '도입 시 참고' 열의 핵심 구절만 SemiBold INK.
    header: ["구분", "실측", "도입 시 참고"]
    rows:
      - ["저장 용량", "모델 저장소만 1.4TB 사용 중\n30B급 20~60GB · 100B급+ 130~180GB, 비교용 모델 누적 빠름", "모델 1~2TB + 학습 데이터를 빼면 제조 데이터까지 같은 서버에 두기엔 남는 공간 부족 — 대용량 소수 구성(예: 7.68TB × 2~4)이 슬롯 · 관리 유리"]
      - ["서버 역할 분리", "AI 환경 업데이트 재부팅마다 DB 동반 다운 · 학습 자원 점유 시 DB 응답 저하 → 분리 운영", "GPU 서버와 데이터 플랫폼 서버 분리 구성 (데이터 서버에 GPU 불요)"]
      - ["전원 · 발열", "RTX PRO 6000 제품군별 소비전력 300W / 600W 2배 차이 — 600W × 4장 = GPU만 2,400W", "일반 사무실 콘센트 불가 — 전용 회로 · 전산실 설치. 견적 시 제품군 확인"]
      - ["운영체제", "Ubuntu 단일 운영 — AI 도구 대부분 Linux 기준", "듀얼부팅은 OS 전환 시 전원 차단 필요 → 공용 서버 부적합"]
      - ["GPU 사용률 기록", "초기 기록 부재로 배치 수 차례 조정", "도입 초기부터 사용률 기록 → 증설 판단 근거 확보"]
  - kind: closing_band
    desc: "하단 다크 슬랩 (INK 배경 ~0.5in) — 마무리 한 줄"
    text: "저희 구축 과정에서 확인한 내용 공유 — 필요 시 도입처 담당자 연결 등 지원 가능"
    style: "ON_INK 11pt 중앙, '지원 가능' PRIMARY_BRIGHT"
data_refs: ["analysis.yaml > ops_experience"]
constraints:
  min_nontext_elements: 2
  visual_primitive: "grid_table"
notes: |
  배분: 리드 ~0.35 / 표 ~4.6 (헤더 0.4 + 5행×0.82) / 다크 슬랩 ~0.5.
  행 높이는 estimate_container_height 로 텍스트 기반 산출 — 셀 넘침 금지.
  열 폭 비율 [구분 1.3 | 경험 4.4 | 참고 4.4] 근사.
  상대 계획 수치(10TB · 1TB×10 등) 직접 인용 금지 — "대용량 소수 구성" 일반 권고로 서술.
  톤: 권고 조 아닌 참고 조 ("~권장" 대신 "~유리", "~부적합" 등 경험 서술).
