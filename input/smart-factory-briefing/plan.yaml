banned_details: |
  - 이모지·그림자·파스텔 다색·CHEVRON/CAN/CUBE 등 의미 도형 금지 (design_system.md 4절)
  - 포트 번호·호스트 IP·내부 프레임워크명(FastAPI·LangGraph·Celery 등) 노출 금지 — 통신 용어는 MCP·HTTPS 허용 (rev5)
  - 명사형 간결체 ("~를 만든다" 구호형 서술 금지)
  - 생기센터 계획서 수치(9,500만원·Threadripper 등)를 슬라이드에 직접 인용 금지 — 우리 경험만 서술
  - 추정치는 "약", "산정 기준" 명시 — 단정 금지
  - LLM 만능 수렴 구도 금지 — LLM 은 파이프라인의 한 단계
