narrative: |
  생기센터(생산기술센터 스마트제조기술팀) 정보공유 브리핑 8장.
  흐름(rev5, 9장): 표지 → [플랫폼 축] 현황① 코딩·취약점(S2) · 현황② 문서 생성(S3, v11 이식)
       · 아키텍처(S4) · AI 활용 전략(S5)
       → [인프라 축] 서버 스펙(S6)
       → [실측 축] 후보 모델 실측(S7) · 동시 처리 / 프론티어 구동 조건(S8)
       → 운영 경험 · 도입 시 참고(S9).
  생기센터는 로컬 LLM 중심 자체 서버를 계획 중 — 우리도 같은 이유(보안·비용)로 로컬에서
  출발했다가 실측 한계로 상용 전환한 경험(S4)이 S6·S7 실측의 복선이 된다.
  톤: "판단에 참고하실 자료" — 상대 계획 부정 금지, 추정치 단정 금지.
